<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas - Iniciar Sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        instBg: '#F4F6F8',
                        instPrimary: '#3B5266',
                        instRoyal: '#1D4ED8',
                        instRoyalHover: '#2563EB',
                        instAqua: '#00D9FF',
                        instText: '#2D3748',
                        instBorder: '#CFD8DC'
                    }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar Superior: En Login los elementos de navegación permanecen ocultos -->
    <header class="navbar-finanzas shadow-sm">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                <a href="login.html" class="navbar-brand-title">
                    <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-[#00D9FF] text-[#0F172A] fw-bold" style="width: 34px; height: 34px;">
                        $
                    </span>
                    <span>Finanzas</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal: Tarjeta de Inicio de Sesión -->
    <main class="container py-5 d-flex align-items-center justify-content-center">
        <div class="w-100" style="max-width: 420px;">
            <section class="card-finanzas p-4 p-md-5 shadow-sm">

                <div class="text-center mb-4">
                    <h1 class="h3 fw-bold text-[#3B5266] mb-1">Welcome Back</h1>
                    <p class="text-sm text-slate-500 mb-0">
                        Ingresa tus datos para acceder a tu cuenta.
                    </p>
                </div>

                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label for="login-email" class="form-label text-xs fw-bold uppercase text-[#3B5266] mb-1">
                            Correo Electrónico
                        </label>
                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            class="form-control form-control-finanzas"
                            placeholder="tucorreo@ejemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="login-password" class="form-label text-xs fw-bold uppercase text-[#3B5266] mb-1">
                            Contraseña
                        </label>
                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            class="form-control form-control-finanzas"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <!-- Casilla seleccionable -->
                    <div class="mb-4 text-xs text-slate-600">
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="checkbox" id="remember-session">
                            <label class="form-check-label" for="remember-session">
                                Recordar mis datos
                            </label>
                        </div>
                    </div>

                    <!-- Botón de acceso en Azul Rey -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn-royal py-2.5 text-sm">
                            Iniciar Sesión
                        </button>
                    </div>
                </form>

                <!-- Enlace para crear cuenta en español -->
                <div class="text-center pt-3 border-top border-[#CFD8DC] text-sm text-slate-600">
                    ¿No tienes una cuenta?
                    <a href="registro.html" id="link-crear-cuenta" class="fw-bold text-[#1D4ED8] hover:text-[#2563EB] text-decoration-none ms-1">
                        Crear cuenta
                    </a>
                </div>
            </section>
        </div>
    </main>

    <!-- Ventana Emergente / Modal (Estilo Práctica 7) -->
    <div id="modalEmergente" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTituloTexto">
        <div class="modal-card">
            <svg class="icono-prevencion" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
            </svg>
            <h2 id="modalTituloTexto" class="modal-titulo">Aviso</h2>
            <p id="modalMensajeTexto" class="modal-mensaje">
                La cuenta ingresada no existe. Por favor crea una cuenta para continuar.
            </p>
            <button type="button" id="btnCerrarModal" class="btn-modal">Aceptar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/models.js"></script>
    <script src="js/controllers.js"></script>
</body>
</html>
