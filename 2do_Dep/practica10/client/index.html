<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ======================================================================
         SISTEMA DE CONTROL DE FINANZAS PERSONALES
         Archivo: client/index.html
         Rol Arquitectónico: Plantilla base SPA (React View + Bootstrap 5 Layout)
         ====================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaFinanzas - Control Financiero Personal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Framework 1 (Layout & Componentes UI): Bootstrap 5.3.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Utilidades complementarias de diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        instBg: '#F4F6F8',
                        instPrimary: '#3B5266',
                        instRoyal: '#1D4ED8',
                        instRoyalHover: '#2563EB',
                        instAqua: '#00D9FF',
                        instText: '#2D3748',
                        instBorder: '#CFD8DC'
                    }
                }
            }
        };
    </script>
</head>
<body>
    <!-- Contenedor raíz para la capa View en React -->
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
